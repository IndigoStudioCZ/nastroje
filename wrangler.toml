# Stránky se do Workeru importují jako text (src/*.page.html).
[[rules]]
type = "Text"
globs = ["**/*.page.html"]
fallthrough = true

# ----- Statika -----
# run_worker_first = true → Worker běží i pro statiku, aby pustil jen povolené soubory
# a doplnil bezpečnostní hlavičky.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
