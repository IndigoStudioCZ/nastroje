name = "nastroje"
main = "src/worker.js"
compatibility_date = "2025-04-01"

# Worker žije jen na vlastních doménách níže, adresu na workers.dev nepotřebuje.
workers_dev = false

# ----- Domény -----
# Přehled, každý nástroj i rozcestník mají vlastní subdoménu; custom_domain vytvoří
# DNS záznam i certifikát. Seznam musí odpovídat src/tools-data.js (hlídá npm run check).
routes = [
  { pattern = "nastroje.indigostudio.cz", custom_domain = true },
  { pattern = "kalkulacka.indigostudio.cz", custom_domain = true },
  { pattern = "procenta.indigostudio.cz", custom_domain = true },
  { pattern = "trojclenka.indigostudio.cz", custom_domain = true },
  { pattern = "dph.indigostudio.cz", custom_domain = true },
  { pattern = "spropitne.indigostudio.cz", custom_domain = true },
  { pattern = "prevody-jednotek.indigostudio.cz", custom_domain = true },
  { pattern = "prevody-men.indigostudio.cz", custom_domain = true },
  { pattern = "casova-pasma.indigostudio.cz", custom_domain = true },
  { pattern = "velikosti-obleceni.indigostudio.cz", custom_domain = true },
  { pattern = "cista-mzda.indigostudio.cz", custom_domain = true },
  { pattern = "hodinova-sazba.indigostudio.cz", custom_domain = true },
  { pattern = "fakturace.indigostudio.cz", custom_domain = true },
  { pattern = "uroky.indigostudio.cz", custom_domain = true },
  { pattern = "splatky.indigostudio.cz", custom_domain = true },
  { pattern = "kalendar.indigostudio.cz", custom_domain = true },
  { pattern = "datum.indigostudio.cz", custom_domain = true },
  { pattern = "pracovni-dny.indigostudio.cz", custom_domain = true },
  { pattern = "odpocet.indigostudio.cz", custom_domain = true },
  { pattern = "stopky.indigostudio.cz", custom_domain = true },
  { pattern = "casovac.indigostudio.cz", custom_domain = true },
  { pattern = "pocitadlo-slov.indigostudio.cz", custom_domain = true },
  { pattern = "formatovani-textu.indigostudio.cz", custom_domain = true },
  { pattern = "qr-kod.indigostudio.cz", custom_domain = true },
  { pattern = "generator-hesel.indigostudio.cz", custom_domain = true },
  { pattern = "barvy.indigostudio.cz", custom_domain = true },
  { pattern = "kontrast.indigostudio.cz", custom_domain = true },
  { pattern = "rozmery-obrazku.indigostudio.cz", custom_domain = true },
  { pattern = "komprese-obrazku.indigostudio.cz", custom_domain = true },
  { pattern = "metadata.indigostudio.cz", custom_domain = true },
